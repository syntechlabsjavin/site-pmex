<!DOCTYPE html>
<html lang="en" data-css="site-buttons reference-typography style site-motion site-faq-accordion specialty-site-palette navbar-d90c332f services-mega booking-modal">

<head>
<link rel="stylesheet" href="/css/root.css"/>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Demo — PMEX</title>
    
    <script src="/js/demo-modal.js" defer></script>
    <script src="/js/nav-dropdown.js" defer></script>
<script src="/js/site-motion.js" defer></script>
<script src="/js/reference-typography.js" defer></script>
<script src="/js/services-mega.js" defer></script>
</head>

<body class="min-h-screen bg-[var(--c-EEF0E8)] flex items-center justify-center p-4">
<script src="/js/site-shell.js" data-include="header"></script>

    <!-- ===================================================
     BOOK A DEMO — Scheduling Modal
=================================================== -->

    <div id="booking-modal-overlay" class="bk-overlay" role="dialog" aria-modal="true" aria-labelledby="bk-event-title">
        <div class="bk-card" id="booking-modal-card">

            <button type="button" class="bk-close" aria-label="Close"
                onclick="if(window.closeBookingModal){window.closeBookingModal();}else{history.back();}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#demo-icon"></use></svg>
            </button>

            <!-- LEFT PANEL: event summary -->
            <aside class="bk-aside">
                <button type="button" class="bk-back" aria-label="Back" onclick="window.bookingBack ? window.bookingBack() : history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-left-rounded"></use></svg>
                </button>
                <img src="/img/logo/grey-logo.svg" alt="PMEX" class="bk-logo" onerror="this.style.display='none'">
                <div class="bk-event-title" id="bk-event-title" role="heading" aria-level="2">Intro to PMEX</div>
                <ul class="bk-meta">
                    <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#clock-rounded"></use></svg><span>15 min</span></li>
                    <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#demo-intro-to-pmex"></use></svg><span>Web conferencing details provided upon confirmation.</span></li>
                </ul>
                <ul id="booking-selected-datetime" class="bk-meta bk-meta-picked hidden">
                    <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#demo-intro-to-pmex-variant-2"></use></svg><span id="booking-selected-datetime-text"></span></li>
                    <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#globe"></use></svg><span id="booking-selected-tz-text">Pacific Time - US &amp; Canada</span></li>
                </ul>
            </aside>

            <!-- STEP 1: calendar -->
            <section id="booking-step-1" class="bk-step bk-step-cal">
                <div class="bk-cal">
                    <div class="bk-title" role="heading" aria-level="3">Select a Date &amp; Time</div>
                    <div class="bk-month">
                        <button type="button" class="bk-nav" aria-label="Previous month" onclick="window.changeMonth(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-left-rounded"></use></svg></button>
                        <p id="booking-month-label" class="bk-month-label" aria-live="polite"></p>
                        <button type="button" class="bk-nav" aria-label="Next month" onclick="window.changeMonth(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-right-rounded"></use></svg></button>
                    </div>
                    <div class="bk-weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
                    <div id="booking-calendar-grid" class="bk-days"></div>
                </div>
                <div class="bk-tz">
                    <p class="bk-tz-label">Time zone</p>
                    <button type="button" class="tz-trigger-btn bk-tz-btn" onclick="window.toggleTzDropdown(event)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#globe"></use></svg>
                        <span class="tz-trigger-text">Pacific Time - US &amp; Canada</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tz-arrow" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-down"></use></svg>
                    </button>
                </div>
            </section>

            <!-- STEP 2: calendar + time slots -->
            <section id="booking-step-2" class="bk-step bk-step-slots hidden">
                <div class="bk-step-cal">
                    <div class="bk-cal">
                        <div class="bk-title" role="heading" aria-level="3">Select a Date &amp; Time</div>
                        <div class="bk-month">
                            <button type="button" class="bk-nav" aria-label="Previous month" onclick="window.changeMonth(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-left-rounded"></use></svg></button>
                            <p id="booking-month-label-2" class="bk-month-label" aria-live="polite"></p>
                            <button type="button" class="bk-nav" aria-label="Next month" onclick="window.changeMonth(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-right-rounded"></use></svg></button>
                        </div>
                        <div class="bk-weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
                        <div id="booking-calendar-grid-2" class="bk-days"></div>
                    </div>
                    <div class="bk-tz">
                        <p class="bk-tz-label">Time zone</p>
                        <button type="button" class="tz-trigger-btn bk-tz-btn" onclick="window.toggleTzDropdown(event)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="/icons/site-icons.svg#globe"></use></svg>
                            <span class="tz-trigger-text">Pacific Time - US &amp; Canada</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tz-arrow" aria-hidden="true"><use href="/icons/site-icons.svg#chevron-down"></use></svg>
                        </button>
                    </div>
                </div>
                <div class="bk-slots">
                    <p id="booking-slots-date-label" class="bk-slots-date"></p>
                    <div id="booking-slots-list" class="bk-slots-list"></div>
                </div>
            </section>

            <!-- TIME ZONE DROPDOWN -->
            <div id="booking-tz-dropdown" class="bk-tz-menu hidden">
                <div class="bk-tz-search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><use href="/icons/site-icons.svg#demo-icon-variant-2"></use></svg>
                    <input type="text" id="tz-search-input" oninput="window.filterTzList(this.value)" placeholder="Search time zones" aria-label="Search time zones">
                </div>
                <div class="bk-tz-head">
                    <span>Time zone</span>
                    <div class="bk-tz-format">
                        <span id="tz-format-am-label" class="is-on">am/pm</span>
                        <button type="button" id="tz-format-toggle-btn" class="bk-switch" aria-label="Use 24 hour time" onclick="window.toggleTzFormat()"><span id="tz-format-toggle-dot"></span></button>
                        <span id="tz-format-24-label">24h</span>
                    </div>
                </div>
                <div id="tz-list-container" class="bk-tz-list"></div>
            </div>

            <!-- STEP 3: details form -->
            <section id="booking-step-3" class="bk-step bk-step-form hidden">
                <div class="bk-title" role="heading" aria-level="3">Enter Details</div>
                <form onsubmit="window.submitBookingForm(event)" class="bk-form">
                    <div class="bk-row">
                        <label class="bk-field"><span>First name <b>*</b></span><input required type="text" autocomplete="given-name"></label>
                        <label class="bk-field"><span>Last name <b>*</b></span><input required type="text" autocomplete="family-name"></label>
                    </div>
                    <label class="bk-field"><span>Email <b>*</b></span><input required type="email" autocomplete="email"></label>
                    <button type="button" class="bk-guests">Add guests</button>
                    <label class="bk-field"><span>Company Name <b>*</b></span><input required type="text" autocomplete="organization"></label>
                    <label class="bk-field"><span>Job Title <b>*</b></span><input required type="text" autocomplete="organization-title"></label>
                    <label class="bk-field"><span>Phone Number</span><input type="tel" autocomplete="tel"></label>
                    <button type="submit" class="bk-confirm">Confirm</button>
                </form>
            </section>
        </div>
    </div>

<script src="/js/metric-countup.js" defer></script>
</body>

</html>
